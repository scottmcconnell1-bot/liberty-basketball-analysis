<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{% block title %}Liberty Jr High Plays{% endblock %}</title>
  {# Jr High player app pages: no navbar, no job poller, no Google font, no main-app service worker. #}
  <style>
    :root {
      --color-primary:   #01696f;
      --color-primary-d: #015558;
      --color-bg:        #f7f6f2;
      --color-surface:   #ffffff;
      --color-border:    #e2e0da;
      --color-text:      #1a1a1a;
      --color-muted:     #6b7280;
      --radius:          8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.45;
      overflow-x: hidden;
      max-width: 100%;
      padding: 8px;
    }
    img, video { max-width: 100%; height: auto; }
    /* Card and button rules copied from base.html so the play page looks the same. */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      overflow-wrap: break-word;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius); border: none; cursor: pointer;
      font-size: 0.875rem; font-weight: 500; white-space: nowrap; max-width: 100%;
    }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-secondary { background: var(--color-border); color: var(--color-text); }
    .btn-sm { padding: 8px 12px; font-size: 0.9rem; }
    .btn:disabled { opacity: 0.5; }
  </style>
  {% block head %}{% endblock %}
  {% block styles %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
