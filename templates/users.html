{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="mb-4">User Management</h1>
    <p class="mb-3">
      <a class="btn btn-primary" href="{{ url_for('users.register') }}">Create user</a>
      <span class="text-muted" style="margin-left:8px;">Public self-signup is closed — only admins can add accounts.</span>
    </p>
    
    <div class="card" data-frame="14.1">
        <div class="card-body">
            <table class="table" data-frame="14.1t">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Actions</th>
                        <th>Roster player</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="6" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadUsers() {
    const response = await fetch('/api/admin/users');
    if (!response.ok) {
        document.getElementById('usersBody').innerHTML = '<tr><td colspan="6" class="text-danger">Access denied</td></tr>';
        return;
    }
    const users = await response.json();
    document.getElementById('usersBody').innerHTML = users.map(u => {
        const isAdmin = (u.role || '').toLowerCase() === 'admin';
        const badge = isAdmin
            ? '<span class="badge bg-danger">Admin</span>'
            : `<span class="badge bg-secondary">${escapeHtml(u.role || 'user')}</span>`;
        const family = u.role === 'parent' || u.role === 'player';
        const link = family
            ? `<input type="number" min="1" style="width:90px;" value="${u.linked_player_id || ''}" aria-label="Roster player id for ${escapeHtml(u.display_name)}" onchange="linkPlayer(${Number(u.id)}, this.value)">`
            : '';
        return `
        <tr>
            <td>${escapeHtml(u.display_name)}</td>
            <td>${escapeHtml(u.email)}</td>
            <td>${badge}</td>
            <td>${escapeHtml(u.created_at)}</td>
            <td>${!isAdmin ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${Number(u.id)})">Delete</button>` : ''}</td>
            <td>${link}</td>
        </tr>`;
    }).join('');
}

async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;
    const response = await fetch(`/api/users/${id}`, { method: 'DELETE' });
    if (response.ok) loadUsers();
    else {
        const body = await response.json().catch(() => ({}));
        alert(body.error || 'Failed to delete user');
    }
}

async function linkPlayer(id, playerId) {
    const response = await fetch(`/api/admin/users/${id}/player-link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player_id: playerId || null }),
    });
    if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        alert(body.error || 'Could not link that player');
        loadUsers();
    }
}

loadUsers();
</script>
{% endblock %}
