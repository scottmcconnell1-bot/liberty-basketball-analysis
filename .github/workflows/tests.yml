# Runs on pull requests (and on demand). Web stack only: the CV packages (torch/opencv/
# ultralytics) are not installed here, so those tests skip exactly as they do on a
# Windows dev laptop. Model weights are Git LFS pointers in CI and are not needed.
name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One version failing must not cancel the other: when 3.13 took the run down
      # with it, 3.12's numbers were lost and a cross-version difference could not be
      # told apart from a regression.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff
      - name: Lint (undefined names, redefinitions, syntax only)
        run: ruff check --select F821,F811,F823,E9 --exclude '.venv,node_modules,_tmp_*,experiments,benchmark' .
      - name: Tests
        # The six tests once deselected here for pre-existing drift were fixed in #148.
        run: python -m pytest tests/ -q
      - name: Accuracy benchmark
        # Event generator vs the coach's tags on frozen real detections; fails on a
        # precision/recall/F1 drop, or a shot-tag score drop, below
        # benchmarks/accuracy/baseline.json. The table is written to the job summary.
        #
        # always(): a step after a failing one is skipped by default, so while the two
        # known e2e failures stand, this and the secrets audit had stopped running at
        # all. A gate that only runs when everything else is already green is not a gate.
        if: always()
        run: python scripts/accuracy_benchmark.py
      - name: Secrets audit
        if: always()
        run: python scripts/audit_secrets.py
